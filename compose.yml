name: viva-inteligencia

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: same-origin
      DATA_REFRESH_ENABLED: ${DATA_REFRESH_ENABLED:-false}
      DATA_REFRESH_OPERATOR_KEY: ${DATA_REFRESH_OPERATOR_KEY:-}
      DATA_REFRESH_DISPATCH_URL: http://ops:3100
      DATA_REFRESH_INTERNAL_TOKEN: ${DATA_REFRESH_INTERNAL_TOKEN:-}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ops:
    build:
      context: .
      dockerfile: infra/docker/ops.Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OPS_PORT: 3100
      DATA_REFRESH_INTERNAL_TOKEN: ${DATA_REFRESH_INTERNAL_TOKEN:-}
      DATA_REFRESH_EXECUTE: ${DATA_REFRESH_EXECUTE:-false}
    expose:
      - "3100"
    volumes:
      - ops-staging:/app/data/staging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  ops-staging:
